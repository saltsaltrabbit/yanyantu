<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="mini-game">
<title>piano2</title>
<style>
  /* ============================================================
     基础重置与容器
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
    background: transparent;
    overflow: hidden;
  }

  /* 游戏容器 —— 桌面端舒展布局，便于嵌入 */
  .piano-puzzle {
    position: relative;
    width: 92%;
    min-width: 800px;
    max-width: 1200px;
    aspect-ratio: 12 / 7.5;
    margin: 0 auto;
    background: rgba(8, 6, 12, 0.88);
    border-radius: 12px;
    overflow: hidden;
    color: #d4a84a;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 星光粒子画布 */
  .star-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* ============================================================
     主内容区
     ============================================================ */
  .game-content {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    padding: 28px 64px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  /* 顶部工具栏 */
  .top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 32px;
  }

  /* 琴谱图标按钮 */
  .score-icon-btn {
    background: transparent;
    border: 1px solid rgba(212, 168, 74, 0.35);
    color: #d4a84a;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.25s ease;
  }
  .score-icon-btn:hover {
    background: rgba(212, 168, 74, 0.12);
    border-color: rgba(212, 168, 74, 0.6);
  }
  .score-icon-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* 当前曲目名 */
  .piece-title {
    font-size: 13px;
    letter-spacing: 2px;
    color: rgba(212, 168, 74, 0.6);
    font-style: italic;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .piece-title.visible { opacity: 1; }

  /* 参考谱（缩小预览） */
  .reference-wrap {
    width: 100%;
    max-width: 760px;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }
  .reference-wrap.visible {
    opacity: 0.55;
    transform: translateY(0);
  }
  .reference-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(212, 168, 74, 0.5);
    text-align: center;
    margin-bottom: 4px;
    font-style: italic;
  }
  .reference-score {
    width: 100%;
    height: 100px;
  }

  /* ============================================================
     主演奏区（两行五线谱）
     ============================================================ */
  .main-score {
    flex: 1;
    width: 100%;
    max-width: 980px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 36px;
    position: relative;
  }

  .staff-block {
    position: relative;
    width: 100%;
  }

  .staff-svg {
    width: 100%;
    display: block;
  }

  /* 可点击层 —— 只覆盖音符区域（留出左侧谱号位），与 SVG 中音符列对齐
     五条金色谱线直接作为子元素画在点击层内，均匀分布，pointer-events: none 不挡点击 */
  .staff-click-layer {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 10%;
    right: 4%;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    cursor: pointer;
  }

  /* 五条金色谱线（装饰层，不挡点击） */
  .staff-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(to right, #c89a3e, #f0d078, #c89a3e);
    pointer-events: none;
    box-shadow: 0 0 4px rgba(232, 199, 120, 0.5);
    z-index: 1;
  }
  /* 5 条线等间距分布在中央 48/140 ≈ 34.3% 的高度区域内
     SVG 中顶线 y=48, 底线 y=96 → 谱占 48px，在 140 视口中
     顶部偏移 = 48/140 ≈ 34.3%，底部偏移 = 44/140 ≈ 31.4% */
  .staff-line.line-1 { top: calc(48 / 140 * 100%); }       /* 第5线（顶线） */
  .staff-line.line-2 { top: calc(60 / 140 * 100%); }       /* 第4线 */
  .staff-line.line-3 { top: calc(72 / 140 * 100%); }       /* 第3线（中线） */
  .staff-line.line-4 { top: calc(84 / 140 * 100%); }       /* 第2线 */
  .staff-line.line-5 { top: calc(96 / 140 * 100%); }       /* 第1线（底线） */

  /* 小节分隔竖线（普通） */
  .measure-bar {
    position: absolute;
    width: 1.5px;
    top: calc(48 / 140 * 100%);
    bottom: calc(44 / 140 * 100%);
    background: #d4a84a;
    pointer-events: none;
    opacity: 0.65;
    z-index: 2;
  }

  /* 结束线（粗单竖线） */
  .measure-bar.final-bar {
    width: 3px;
    opacity: 0.85;
  }

  /* 左反复记号（双竖线 + 右侧两圆点） */
  .left-repeat-bar {
    position: absolute;
    pointer-events: none;
    z-index: 2;
    top: calc(48 / 140 * 100%);
    bottom: calc(44 / 140 * 100%);
    width: 12px;
  }
  .left-repeat-bar .lr-line-1 {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 1.5px;
    background: #d4a84a;
    opacity: 0.6;
  }
  .left-repeat-bar .lr-line-2 {
    position: absolute;
    left: 4px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #d4a84a;
    opacity: 0.8;
  }
  .left-repeat-bar .lr-dot {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #d4a84a;
    opacity: 0.75;
    left: 9px;
  }
  /* 第二间（约 3/8 处）和第三间（约 5/8 处） */
  .left-repeat-bar .lr-dot.dot-top { top: calc(2 / 8 * 100%); }
  .left-repeat-bar .lr-dot.dot-bottom { top: calc(5 / 8 * 100%); }

  .click-cell {
    position: relative;
    transition: background 0.15s ease;
  }

  /* 当前待弹列的微弱高亮 */
  .click-cell.current-col {
    background: radial-gradient(ellipse at center, rgba(212, 168, 74, 0.08) 0%, transparent 70%);
  }
  .click-cell.current-col.playing {
    background: radial-gradient(ellipse at center, rgba(212, 168, 74, 0.15) 0%, transparent 70%);
  }

  /* 错误闪烁 */
  .click-cell.error-flash {
    animation: errorShake 0.35s ease;
  }
  @keyframes errorShake {
    0%, 100% { background: transparent; }
    25% { background: rgba(200, 60, 60, 0.15); }
    75% { background: rgba(200, 60, 60, 0.1); }
  }

  /* 正确闪光 */
  .click-cell.correct-flash {
    animation: correctGlow 0.5s ease;
  }
  @keyframes correctGlow {
    0% { background: radial-gradient(ellipse at center, rgba(212, 168, 74, 0) 0%, transparent 70%); }
    40% { background: radial-gradient(ellipse at center, rgba(212, 168, 74, 0.35) 0%, transparent 70%); }
    100% { background: radial-gradient(ellipse at center, rgba(212, 168, 74, 0.1) 0%, transparent 70%); }
  }

  /* ============================================================
     曲目选择浮层
     ============================================================ */
  .piece-modal {
    position: absolute;
    top: 72px;
    left: 48px;
    background: rgba(18, 14, 24, 0.95);
    border: 1px solid rgba(212, 168, 74, 0.3);
    border-radius: 8px;
    padding: 12px 0;
    min-width: 220px;
    z-index: 20;
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }
  .piece-modal.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .piece-modal-title {
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(212, 168, 74, 0.5);
    padding: 4px 20px 10px;
    border-bottom: 1px solid rgba(212, 168, 74, 0.15);
    margin-bottom: 4px;
  }
  .piece-option {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    text-align: left;
    padding: 12px 20px;
    cursor: pointer;
    color: #d4a84a;
    font-family: inherit;
    font-size: 14px;
    transition: background 0.2s ease;
  }
  .piece-option:hover {
    background: rgba(212, 168, 74, 0.1);
  }
  .piece-option .piece-name {
    display: block;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .piece-option .piece-composer {
    display: block;
    font-size: 11px;
    color: rgba(212, 168, 74, 0.5);
    font-style: italic;
    letter-spacing: 1px;
  }
  .piece-option.active .piece-name::before {
    content: "♪ ";
    color: #e8c778;
  }

  /* 提示文字 */
  .hint-text {
    font-size: 12px;
    color: rgba(212, 168, 74, 0.4);
    letter-spacing: 2px;
    text-align: center;
    margin-top: auto;
    font-style: italic;
    transition: opacity 0.4s ease;
  }
  .hint-text.hidden { opacity: 0; }

  /* 进度指示点 */
  .progress-dots {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    margin-top: 8px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }
  .progress-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(212, 168, 74, 0.2);
    transition: background 0.3s ease;
  }
  .progress-dot.done {
    background: #d4a84a;
    box-shadow: 0 0 4px rgba(212, 168, 74, 0.6);
  }
</style>
</head>
<body>

<div class="piano-puzzle" id="pianoPuzzle">
  <canvas class="star-canvas" id="starCanvas"></canvas>

  <div class="game-content">
    <!-- 顶部工具栏 -->
    <div class="top-bar">
      <span style="width:36px"></span>
      <span class="piece-title visible" id="pieceTitle">梦幻曲 · 舒曼</span>
      <span style="width:36px"></span>

    <!-- 参考谱 -->
    <div class="reference-wrap" id="referenceWrap">
      <div class="reference-label">参考谱</div>
      <svg class="reference-score" id="referenceScore" viewBox="0 0 760 100" preserveAspectRatio="xMidYMid meet">

      </svg>

    <!-- 主演奏区 -->
    <div class="main-score" id="mainScore">
      <!-- 高音谱 -->
      <div class="staff-block" data-clef="treble">
        <svg class="staff-svg" id="trebleSvg" viewBox="0 0 900 140" preserveAspectRatio="xMidYMid meet">

      <!-- 低音谱 -->
      <div class="staff-block" data-clef="bass">
        <svg class="staff-svg" id="bassSvg" viewBox="0 0 900 140" preserveAspectRatio="xMidYMid meet">
          <!-- 由 JS 绘制 -->
        </svg>
        <div class="staff-click-layer" id="bassClickLayer"></div>
      </div>
    </div>

    <!-- 进度点 -->
    <div class="progress-dots" id="progressDots"></div>

    <!-- 提示文字 -->
    <div class="hint-text" id="hintText">参考上方谱例，在当前小节内按任意顺序点击正确音高</div>
  </div>

  <!-- 曲目选择浮层（已隐藏，保留代码以便恢复选曲功能） -->
  <div class="piece-modal" id="pieceModal" style="display:none">
    <div class="piece-modal-title">选择曲目</div>
    <button class="piece-option" data-piece="moonlight">
      <span class="piece-name">月光奏鸣曲</span>
      <span class="piece-composer">贝多芬 · Beethoven</span>

    <button class="piece-option" data-piece="gymnopedie">
      <span class="piece-name">裸体舞曲</span>
      <span class="piece-composer">萨蒂 · Satie</span>
    </button>
    <button class="piece-option" data-piece="traumerei">
      <span class="piece-name">梦幻曲</span>
      <span class="piece-composer">舒曼 · Schumann</span>
    </button>
  </div>

</div>
